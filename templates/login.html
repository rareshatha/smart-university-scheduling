<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart University Schedule | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/">
                <img src="{{ url_for('static', filename='images/image_1.png') }}" alt="Logo">
            </a>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-card wide-card">
            <div class="row g-0 h-100">
              
                <div class="col-md-7 form-side border-end">
                    <div class="login-form-container text-center">
                        <h3 class="login-main-title">Welcome Back</h3>
                        <p class="text-muted mb-4">Enter your account details to continue.</p>
                        
                        <form id="loginForm">
                            <div class="mb-3 text-start">
                                <label class="small fw-bold text-muted mb-2 d-block">Username / ID</label>
                                <input type="text" id="username" class="form-control login-field" placeholder="Enter your ID" required>
                            </div>
                            <div class="mb-4 text-start">
                                <label class="small fw-bold text-muted mb-2 d-block">Password</label>
                                <input type="password" id="password" class="form-control login-field" placeholder="••••••••" required>
                            </div>
                            
                            <button type="button" class="btn-auth w-100" onclick="handleLogin()">Sign In</button>
                            
                            <div class="forgot-link-wrapper mt-4">
                                <span>Don't have an account?</span> 
                                <a href="/contact" class="admin-link-custom">Contact Admin</a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-md-5 welcome-side">
                    <div class="welcome-content text-center w-100">
                        <img src="{{ url_for('static', filename='images/image_0.png') }}" alt="USU Logo" class="login-inner-logo">
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/auth_contact.js') }}"></script>
</body>
</html>
