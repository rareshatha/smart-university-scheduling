<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Schedule | Academic Timetable</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/visitor.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <a href="#">
                <img src="{{ url_for('static', filename='images/image_1.png') }}" alt="Logo">
            </a>
        </div>
        <div class="nav-links-center">
            <a href="/" class="nav-link-custom">Home</a>
            <a href="/about" class="nav-link-custom">About Us</a>
            <a href="/contact" class="nav-link-custom">Contact</a>
        </div>
        <div class="nav-login-side">
            <a href="/login_page" class="btn-login-nav">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="visitor-hero">
            <h2>Academic Timetable</h2>
            <p>Search and filter university schedules easily.</p>
        </div>

        <div class="schedule-container">
            
            <div class="filter-card">
                <div class="row g-4">
                    <div class="col-md-3">
                        <label>Semester (Term)</label>
                        <select class="form-select" id="termFilter" onchange="filterData()">
                            <option value="">All Semesters</option>
                            <option value="Fall 2024 - 2421">Fall 2024 - 2421</option>
                            <option value="Spring 2025 - 2422">Spring 2025 - 2422</option>
                            <option value="Fall 2025 - 2521">Fall 2025 - 2521</option>
                            <option value="Spring 2026 - 2522">Spring 2026 - 2522</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label>Subject (e.g. AI, CS)</label>
                        <select class="form-select" id="subjectFilter" onchange="filterData()">
                            <option value="">All Subjects</option>
                            <option value="AI">Artificial Intelligence</option>
                            <option value="SE">Software Engineering</option>
                            <option value="FC">Cybersecurity</option>
                            <option value="CS">Computer Science</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label>Day</label>
                        <select class="form-select" id="dayFilter" onchange="filterData()">
                            <option value="">All Days</option>
                            <option value="Sun">Sunday</option>
                            <option value="Mon">Monday</option>
                            <option value="Tues">Tuesday</option>
                            <option value="Wed">Wednesday</option>
                            <option value="Thurs">Thursday</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label>Search Details</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa fa-search"></i></span>
                            <input type="text" id="vSearch" class="form-control border-start-0" placeholder="Instructor, Room, Course Name..." onkeyup="filterData()">
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-card">
                <div class="table-responsive">
                    <table class="uni-table">
                        <thead>
                            <tr>
                                <th>Term</th>
                                <th>Course Code</th> 
                                <th>Course Name</th>
                                <th>Instructor</th>
                                <th>Room</th>
                                <th>Day</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="vTableBody">
                            </tbody>
                    </table>
                </div>
                
                <div id="noDataMsg" class="text-center p-5 text-muted" style="display:none;">
                    <i class="fa-solid fa-calendar-xmark fa-3x mb-3"></i>
                    <p>No schedules match your filters.</p>
                </div>
            </div>

        </div> </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/core.js') }}"></script>
<script src="{{ url_for('static', filename='js/visitor_logic.js') }}"></script>
</body>
</html>
